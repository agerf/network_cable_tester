<text x="40" y="838" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5a5a5a" font-weight="normal" text-anchor="start">Ab 48 V liegen an den Taps ca. ±1,1 V (Differenz ca. 2,2 V); die BAV99 begrenzen negative Auslenkungen.</text>
