<text x="40" y="858" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5a5a5a" font-weight="normal" text-anchor="start">R1–R8: 1 kΩ pro Ader und Node (0,25 W). GPIO 4–11; die internen Pull-downs (~45 kΩ) bleiben aktiv.</text>
<text x="40" y="882" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5a5a5a" font-weight="normal" text-anchor="start">Am Slave-Pin ca. 3,16 V bei 3,3 V Treiberpegel (V_IH = 2,475 V). Längenmessung: pullup_ohm ≈ 46000.</text>
<text x="40" y="906" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5a5a5a" font-weight="normal" text-anchor="start">Nur spannungsfreie, nicht angeschlossene Kabel testen — kein PoE, keine aktiven Netzwerkgeräte.</text>
